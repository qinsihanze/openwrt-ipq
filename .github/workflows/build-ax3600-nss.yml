name: Build Xiaomi AX3600 NSS Firmware

on:
  workflow_dispatch:
    inputs:
      record_build_info:
        description: "Record build info to release"
        required: false
        default: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Install Build Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils python3-setuptools rsync unzip zlib1g-dev file \
            wget time libelf-dev ecj fastjar subversion patch libglib2.0-dev
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Update and Install Feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate Config for Xiaomi AX3600
        run: |
          # Copy seed file
          cp nss-setup/config-nss.seed .config

          # Enable Xiaomi AX3600
          sed -i 's/# CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600 is not set/CONFIG_TARGET_qualcommax_ipq807x_DEVICE_xiaomi_ax3600=y/' .config

          # Generate full config
          make defconfig

      - name: Download Package Sources
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile Firmware
        run: |
          echo "$(nproc) thread compile"
          make -j$(nproc) || make -j1 V=s

      - name: Organize Firmware Files
        id: organize
        run: |
          echo "build_date=$(date +"%Y%m%d_%H%M")" >> $GITHUB_OUTPUT

      - name: Upload Firmware and Packages Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi_AX3600_NSS_Firmware_${{ steps.organize.outputs.build_date }}
          path: bin/targets/qualcommax/ipq807x/*

